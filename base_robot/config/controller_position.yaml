# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    
    # 增加 PID 参数以对抗重力
    gains:
      joint1: {p: 2000.0, i: 1.0, d: 50.0}
      joint2: {p: 8000.0, i: 10.0, d: 100.0} # 负载最大，P和I给最高
      joint3: {p: 5000.0, i: 5.0, d: 70.0}
      joint4: {p: 2000.0, i: 1.0, d: 30.0}
      joint5: {p: 1000.0, i: 1.0, d: 20.0}
      joint6: {p: 500.0, i: 0.1, d: 10.0}

gripper_controller:
  ros__parameters:
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      joint7: {p: 200.0, i: 0.1, d: 1.0}
      joint8: {p: 200.0, i: 0.1, d: 1.0}